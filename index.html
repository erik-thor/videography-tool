<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <title>Philosophy Video Journal - Recording Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@400;700&family=Architects+Daughter&display=swap" rel="stylesheet">
    <!-- Pre-warm handwritten fonts so canvas ctx.fillText renders them immediately without delay -->
    <style>
      ._font-prewarm {
        position: absolute;
        top: -9999px;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <!-- Hidden font pre-warm elements — ensures Caveat and Architects Daughter are loaded before canvas drawing -->
    <div class="_font-prewarm" aria-hidden="true">
      <span style="font-family: 'Caveat', cursive;">prewarm</span>
      <span style="font-family: 'Architects Daughter', cursive;">prewarm</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

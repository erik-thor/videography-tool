version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videography-tool-web
    ports:
      - "8080:80"
    networks:
      - default
      - tools_network
    restart: unless-stopped

networks:
  tools_network:
    # If running on a laptop/local machine without this network,
    # run: docker network create tools_network
    external: true


